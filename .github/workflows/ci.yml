name: physiotrack - CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
      - 'chore/**'
      - 'coldfix/**'
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE: physiotrack-api
  MIGRATOR_IMAGE: physiotrack-migrator

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - run: make install
      - run: make lint
      - run: make test

  migrator-quality:
    name: Standalone migrator lint, PostgreSQL & image tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - run: uv sync --project migrator --frozen
      - run: uv run --project migrator --frozen ruff check migrator
      - run: uv run --project migrator --frozen ruff format --check migrator
      - run: uv run --project migrator --frozen pytest -c migrator/pyproject.toml migrator/tests

  image:
    name: Build & publish API and migrator images
    runs-on: ubuntu-latest
    needs: [quality, migrator-quality]
    steps:
      - uses: actions/checkout@v7

      - name: Validate version
        run: make check-version

      - name: Build image
        run: make docker-build BRANCH=${{ github.head_ref || github.ref_name }} REGISTRY=${{ env.REGISTRY }} IMAGE=${{ env.IMAGE }} MIGRATOR_IMAGE=${{ env.MIGRATOR_IMAGE }}

      - name: List tags
        run: make docker-tags BRANCH=${{ github.head_ref || github.ref_name }} REGISTRY=${{ env.REGISTRY }} IMAGE=${{ env.IMAGE }} MIGRATOR_IMAGE=${{ env.MIGRATOR_IMAGE }}

      - name: Log in to GHCR
        if: >-
          (github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main' || startsWith(github.ref_name, 'release/'))) ||
          (github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        # Push on merges/pushes to main/develop, direct pushes to release/* branches, and PRs targeting main/develop
        if: >-
          (github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main' || startsWith(github.ref_name, 'release/'))) ||
          (github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main'))
        run: make docker-push BRANCH=${{ github.head_ref || github.ref_name }} REGISTRY=${{ env.REGISTRY }} IMAGE=${{ env.IMAGE }} MIGRATOR_IMAGE=${{ env.MIGRATOR_IMAGE }}
